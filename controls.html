<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111b25"><title>Xbox Controls · GTA VI CC</title><style>body{background:#101b24;color:white;font:16px system-ui;margin:0;padding:18px}a{color:#ffb57b}svg{max-width:850px;width:100%;height:auto}input,select{background:#263b48;color:white;padding:10px;border:1px solid #678;border-radius:8px;font:inherit}input{width:95%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#192b36;padding:16px;border-radius:14px;margin:12px 0}.muted{color:#b6c5ce}</style></head><body><a href="./">← Dashboard</a><h1>🎮 Xbox Controller</h1><p class="muted">Xbox button layout. GTA VI gameplay bindings must be verified in the game's Settings → Controls; edit them below to match your configuration.</p><div class="card"><svg viewBox="0 0 800 440" role="img" aria-label="Labeled Xbox controller"><path d="M170 130Q180 70 270 90L340 110Q400 130 460 110L530 90Q620 70 630 130L740 330Q765 410 690 420L580 305H220L110 420Q35 410 60 330Z" fill="#344a58" stroke="#8ca4b0" stroke-width="5"/><g fill="#172631" stroke="#a4b8c3" stroke-width="3"><circle cx="255" cy="200" r="44"/><circle cx="505" cy="285" r="44"/><path d="M245 278h30v-27h27v27h28v27h-28v27h-27v-27h-30z"/><circle cx="615" cy="170" r="20"/><circle cx="650" cy="205" r="20"/><circle cx="580" cy="205" r="20"/><circle cx="615" cy="240" r="20"/><rect x="240" y="66" width="100" height="24" rx="10"/><rect x="460" y="66" width="100" height="24" rx="10"/><rect x="250" y="43" width="80" height="16" rx="7"/><rect x="470" y="43" width="80" height="16" rx="7"/><circle cx="380" cy="195" r="12"/><circle cx="420" cy="155" r="22"/><circle cx="460" cy="195" r="12"/></g><g font-size="17" font-family="system-ui" fill="white"><text x="8" y="40">LT</text><text x="8" y="94">LB</text><text x="746" y="40">RT</text><text x="746" y="94">RB</text><text x="8" y="192">Left stick / L3</text><text x="8" y="360">D-pad</text><text x="600" y="365">Right stick / R3</text><text x="345" y="400">View · Menu</text><text x="615" y="176" text-anchor="middle">Y</text><text x="650" y="211" text-anchor="middle">B</text><text x="580" y="211" text-anchor="middle">X</text><text x="615" y="246" text-anchor="middle">A</text></g><g stroke="#ffb57b" stroke-width="2" fill="none"><path d="M290 50L120 35H38"/><path d="M290 78L140 90H38"/><path d="M510 50L680 35H738"/><path d="M510 78L680 90H738"/><path d="M255 200L165 185H140"/><path d="M275 307L160 355H70"/><path d="M505 285L600 345"/></g></svg></div><div class="card"><label for="mode">Context: </label><select id="mode"><option value="foot">On foot</option><option value="drive">Driving</option><option value="combat">Combat</option><option value="menu">Menus</option></select><p class="muted">Tap a field and enter the action shown in GTA VI. Changes save on this device.</p><div id="fields" class="grid"></div></div><script>const keys=['LT','LB','RT','RB','Left stick','L3','Right stick','R3','D-pad up','D-pad down','D-pad left','D-pad right','A','B','X','Y','View','Menu'];const m=document.getElementById('mode'),f=document.getElementById('fields');function render(){let d=JSON.parse(localStorage.getItem('gta6-controls')||'{}');f.replaceChildren();keys.forEach(k=>{let box=document.createElement('div'),lab=document.createElement('label'),i=document.createElement('input');lab.textContent=k;i.value=(d[m.value]||{})[k]||'';i.placeholder='Set action';i.addEventListener('input',()=>{let x=JSON.parse(localStorage.getItem('gta6-controls')||'{}');x[m.value]??={};x[m.value][k]=i.value;localStorage.setItem('gta6-controls',JSON.stringify(x))});box.append(lab,i);f.append(box)})}m.onchange=render;render()</script></body></html>
